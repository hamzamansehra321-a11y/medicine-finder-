<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Medicine App</h1>

    <input type="text" placeholder="Medicine Name">

    <input type="text" placeholder="Formula">

    <input type="text" placeholder="Uses">

    <input type="file" accept="image/*">

    <button onclick="alert('Medicine App is working!')">
        Add Medicine
    </button>

</div>

</body>
</html>
